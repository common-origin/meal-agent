name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # "Routine" = a patch/minor bump to an npm/pnpm dependency, or any
      # GitHub Actions version bump (Actions tags don't follow real semver,
      # so there's no patch/minor distinction to key off there — CI passing
      # is the safety net instead). A major npm/pnpm bump can carry breaking
      # changes CI won't always catch, so those are left for manual review.
      - name: Enable auto-merge for routine bumps
        if: |
          steps.metadata.outputs.package-ecosystem == 'github_actions' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
